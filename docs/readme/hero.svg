<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">MZ Icon Design</title>
  <desc id="desc">A project-native icon keyline showing how 16 to 32 pixel UI requests route to SVG while 48 to 256 pixel spot requests route to reviewed PNG styles.</desc>

  <defs>
    <pattern id="micro-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#102A43" stroke-width="1" opacity="0.08"/>
    </pattern>
    <marker id="route-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#D9A514"/>
    </marker>
  </defs>

  <rect width="1200" height="360" rx="28" fill="#F7F1E3"/>
  <rect x="548" y="0" width="652" height="360" fill="url(#micro-grid)"/>

  <g id="title-block" transform="translate(58 46)">
    <rect x="0" y="0" width="12" height="30" rx="6" fill="#D9A514"/>
    <text x="28" y="22" fill="#6B7280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" letter-spacing="2">MZ / ICON SYSTEM</text>
    <text x="0" y="104" fill="#102A43" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="72" font-weight="800" letter-spacing="-2">MZ ICON</text>
    <text x="0" y="178" fill="#102A43" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="76" font-weight="800" letter-spacing="-2">DESIGN</text>
    <text x="2" y="224" fill="#324A5F" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="24" font-weight="550">Right route. Original output. Review first.</text>
    <path d="M2 248H414" stroke="#D9A514" stroke-width="4" stroke-linecap="round"/>
    <circle cx="430" cy="248" r="8" fill="#C65A3A"/>
    <text x="2" y="286" fill="#6B7280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">v1.3.0  /  SVG + PNG  /  READY_FOR_REVIEW</text>
  </g>

  <g id="keyline-specimen">
    <rect x="574" y="58" width="238" height="238" rx="24" fill="#FFFDF8" stroke="#102A43" stroke-width="2"/>
    <rect x="594" y="78" width="198" height="198" fill="url(#micro-grid)" stroke="#D9A514" stroke-width="2"/>
    <circle cx="693" cy="177" r="81" fill="none" stroke="#102A43" stroke-width="2" stroke-dasharray="6 7" opacity="0.35"/>
    <path d="M3.5 10.7 12 3l8.5 7.7v8.8A1.5 1.5 0 0 1 19 21H5a1.5 1.5 0 0 1-1.5-1.5v-8.8ZM9 21v-6h6v6H9Z"
          transform="translate(620 104) scale(6.1)" fill="#102A43"/>
    <rect x="594" y="78" width="54" height="28" rx="14" fill="#D9A514"/>
    <text x="610" y="98" fill="#102A43" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="800">24×24</text>
    <circle cx="594" cy="78" r="6" fill="#C65A3A"/>
    <circle cx="792" cy="78" r="6" fill="#C65A3A"/>
    <circle cx="594" cy="276" r="6" fill="#C65A3A"/>
    <circle cx="792" cy="276" r="6" fill="#C65A3A"/>
  </g>

  <g id="route-cards">
    <text x="852" y="46" fill="#6B7280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" letter-spacing="1.5">ROUTE BY USE + SIZE</text>
    <path d="M812 126H844" stroke="#D9A514" stroke-width="4" stroke-linecap="round" marker-end="url(#route-arrow)"/>
    <path d="M812 240H844" stroke="#D9A514" stroke-width="4" stroke-linecap="round" marker-end="url(#route-arrow)"/>

    <rect x="856" y="64" width="286" height="104" rx="20" fill="#102A43"/>
    <rect x="878" y="82" width="104" height="28" rx="14" fill="#D9A514"/>
    <text x="894" y="102" fill="#102A43" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="800">16–32 PX</text>
    <text x="878" y="140" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="28" font-weight="800">UI SVG</text>
    <text x="1008" y="140" fill="#E8C75A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">line + filled</text>

    <rect x="856" y="188" width="286" height="104" rx="20" fill="#FFFDF8" stroke="#102A43" stroke-width="2"/>
    <rect x="878" y="206" width="116" height="28" rx="14" fill="#C65A3A"/>
    <text x="891" y="226" fill="#FFFDF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="800">48–256 PX</text>
    <text x="878" y="264" fill="#102A43" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="28" font-weight="800">SPOT PNG</text>
    <text x="1032" y="264" fill="#6B7280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">10 styles</text>
  </g>

  <text x="574" y="330" fill="#6B7280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">INTENDED USE → DISPLAY SIZE → TRACK QA → HUMAN REVIEW</text>
</svg>
