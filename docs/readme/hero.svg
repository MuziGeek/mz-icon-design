<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">MZ Icon Design</title>
  <desc id="desc">An identity-neutral routing diagram for UI SVG and Spot PNG icon production.</desc>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#173557" opacity=".08"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#e7ad1a"/></marker>
  </defs>
  <rect width="1200" height="360" rx="24" fill="#faf6eb"/><rect x="520" width="680" height="360" fill="url(#grid)"/>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#173557">
    <text x="48" y="47" font-size="14" font-weight="700" fill="#6d6a62">ONE REQUEST → TWO PRODUCTION TRACKS</text>
    <text x="48" y="122" font-size="58" font-weight="800">MZ Icon Design</text>
    <path d="M52 142C162 134 272 148 398 138" fill="none" stroke="#e7ad1a" stroke-width="10" stroke-linecap="round"/>
    <text x="48" y="188" font-size="22">Right route. Original output. Review first.</text>
    <text x="48" y="226" font-family="ui-monospace, monospace" font-size="15" fill="#6d6a62">v2.0.0 · EXPLICIT EXTENSIONS · READY_FOR_REVIEW</text>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="574" y="70" width="238" height="220" rx="22" fill="#fffdf7" stroke="#173557" stroke-width="3"/>
    <rect x="608" y="104" width="170" height="170" fill="url(#grid)" stroke="#e7ad1a" stroke-width="2"/>
    <path d="M648 178l45-40 45 40v50h-30v-34h-30v34h-30z" fill="none" stroke="#173557" stroke-width="10" stroke-linejoin="round"/>
    <path d="M812 126h42M812 242h42" stroke="#e7ad1a" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="866" y="74" width="280" height="104" rx="20" fill="#173557"/>
    <text x="890" y="112" fill="#f3c54d" font-family="ui-monospace, monospace" font-size="18" font-weight="700">16–32 PX</text><text x="890" y="150" fill="#fff" font-size="28" font-weight="800">UI SVG</text>
    <rect x="866" y="190" width="280" height="104" rx="20" fill="#fffdf7" stroke="#173557" stroke-width="3"/>
    <text x="890" y="228" fill="#b95336" font-family="ui-monospace, monospace" font-size="18" font-weight="700">48–256 PX</text><text x="890" y="266" fill="#173557" font-size="28" font-weight="800">SPOT PNG</text>
  </g>
</svg>
